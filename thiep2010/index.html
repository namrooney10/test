<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special 🌹</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #fff0f5, #ffe4e1);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(255, 182, 193, 0.4);
            text-align: center;
            max-width: 420px;
            width: 90%;
            position: relative;
            z-index: 10;
            border: 2px solid #ffb6c1;
        }

        h1 {
            color: #ff4d6d;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        p {
            color: #4f5d75;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .cat-container {
            width: 180px;
            height: 180px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cat-svg {
            width: 100%;
            height: 100%;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        button {
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        #btn-yes {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3);
        }

        #btn-yes:hover {
            transform: scale(1.08);
            background-color: #ff758f;
        }

        #btn-no {
            background-color: #a4b0be;
            color: white;
            box-shadow: 0 4px 15px rgba(164, 176, 190, 0.3);
        }

        #btn-no:hover {
            transform: scale(1.08);
            background-color: #bfcbd7;
        }

        /* Hiệu ứng bong bóng rơi/bay */
        .funny-effect {
            position: fixed;
            bottom: -60px;
            font-size: 3rem;
            animation: floatUpAndSpin 2.5s linear forwards;
            opacity: 0;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes floatUpAndSpin {
            0% { transform: translateY(0) rotate(0deg) scale(0.5); opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { transform: translateY(-115vh) rotate(720deg) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card" id="card">
        <h1>20/10 Này Cậu Có Rảnh Không? 🌹</h1>
        
        <div class="cat-container" id="cat-box">
            <!-- Vẽ chú mèo nài nỉ lúc đầu -->
            <svg class="cat-svg" viewBox="0 0 100 100" xmlns="http://w3.org">
                <polygon points="25,35 15,15 40,28" fill="#fbc4b7" />
                <polygon points="75,35 85,15 60,28" fill="#fbc4b7" />
                <polygon points="28,33 20,19 38,28" fill="#fcd7d0" />
                <polygon points="72,33 80,19 62,28" fill="#fcd7d0" />
                <ellipse cx="50" cy="50" rx="35" ry="28" fill="#fbc4b7" />
                <ellipse cx="25" cy="60" rx="7" ry="4" fill="#ff9ebb" opacity="0.6" />
                <ellipse cx="75" cy="60" rx="7" ry="4" fill="#ff9ebb" opacity="0.6" />
                <circle cx="35" cy="48" r="6" fill="#2f3542" />
                <circle cx="33" cy="46" r="2" fill="white" />
                <circle cx="65" cy="48" r="6" fill="#2f3542" />
                <circle cx="63" cy="46" r="2" fill="white" />
                <polygon points="50,56 48,53 52,53" fill="#ff6b8b" />
                <path d="M 46,60 Q 50,57 54,60" stroke="#2f3542" stroke-width="2" fill="none" />
            </svg>
        </div>

        <p id="question">Nhân ngày Phụ nữ Việt Nam, tớ có một lời mời cực kỳ nghiêm túc là muốn rủ cậu đi ăn/đi cà phê một chuyến. Cậu đồng ý nha? ✨</p>
        
        <div class="btn-group">
            <!-- Form ẩn nhận phản hồi -->
            <form id="notification-form" action="https://formspree.io/f/xjygrjqk" method="POST" style="display:none;">
                <input type="text" id="response-input" name="Phản hồi" value="">
            </form>
            <button id="btn-yes">Đồng ý luôn! ❤️</button>
            <button id="btn-no">Không nha 😢</button>
        </div>
    </div>

    <script>
        const btnNo = document.getElementById('btn-no');
        const btnYes = document.getElementById('btn-yes');
        
        // Hàm gửi dữ liệu ngầm lên Formspree
        function sendNotification(statusMessage) {
            const form = document.getElementById('notification-form');
            document.getElementById('response-input').value = statusMessage;
            if (form.action && !form.action.includes('DÁN_LINK_FORMSPREE_CỦA_BẠN_VÀO_ĐÂY')) {
                fetch(form.action, {
                    method: 'POST',
                    body: new FormData(form),
                    headers: { 'Accept': 'application/json' }
                });
            }
        }

        // XỬ LÝ KHI BẤM ĐỒNG Ý
        btnYes.addEventListener('click', function() {
            sendNotification("Crush đã bấm ĐỒNG Ý đi chơi rồi! 🥰🎉");

            document.getElementById('card').innerHTML = `
                <h1>Tuyệt vời ông mặt trời! 🎉</h1>
                <div class="cat-container">
                    <!-- Vẽ chú mèo cười hạnh phúc -->
                    <svg class="cat-svg" viewBox="0 0 100 100" xmlns="http://w3.org">
                        <polygon points="25,35 15,15 40,28" fill="#fbc4b7" />
                        <polygon points="75,35 85,15 60,28" fill="#fbc4b7" />
                        <ellipse cx="50" cy="50" rx="35" ry="28" fill="#fbc4b7" />
                        <path d="M 28,48 Q 35,42 42,48" stroke="#2f3542" stroke-width="3" fill="none" stroke-linecap="round" />
                        <path d="M 58,48 Q 65,42 72,48" stroke="#2f3542" stroke-width="3" fill="none" stroke-linecap="round" />
                        <circle cx="23" cy="58" r="6" fill="#ff4d6d" opacity="0.8" />
                        <circle cx="77" cy="58" r="6" fill="#ff4d6d" opacity="0.8" />
                        <path d="M 44,56 Q 50,68 56,56 Z" fill="#ff6b8b" stroke="#2f3542" stroke-width="1.5" />
                    </svg>
                </div>
                <p>Tớ biết là cậu sẽ đồng ý mà! <br>Lịch trình chi tiết tớ sẽ nhắn tin qua cho cậu ngay nhé. Chuẩn bị lên đồ thật đẹp nha! 🛵💨</p>
            `;
            // Rơi hiệu ứng mèo vui nhộn bay lên trời
            setInterval(() => createEffect(['🐱', '😹', '🚀', '🐾']), 150);
        });

        // XỬ LÝ KHI BẤM KHÔNG ĐỒNG Ý
        btnNo.addEventListener('click', function() {
            sendNotification("Crush từ chối khéo (bấm Hẹn dịp khác) nha. 🥲");

            document.getElementById('card').innerHTML = `
                <h1>Không sao hết nè! ✨</h1>
                <div class="cat-container">
                    <!-- Vẽ chú mèo thấu hiểu, nhẹ nhàng ôm tim -->
                    <svg class="cat-svg" viewBox="0 0 100 100" xmlns="http://w3.org">
                        <polygon points="25,35 15,15 40,28" fill="#d2dae2" />
                        <polygon points="75,35 85,15 60,28" fill="#d2dae2" />
                        <ellipse cx="50" cy="50" rx="35" ry="28" fill="#d2dae2" />
                        <!-- Mắt hiền từ nhẹ nhàng nhắm nhẹ -->
                        <path d="M 30,50 Q 35,53 40,50" stroke="#2f3542" stroke-width="2" fill="none" />
                        <path d="M 60,50 Q 65,53 70,50" stroke="#2f3542" stroke-width="2" fill="none" />
                        <circle cx="25" cy="58" r="4" fill="#ffb8b8" opacity="0.5" />
                        <circle cx="75" cy="58" r="4" fill="#ffb8b8" opacity="0.5" />
                        <!-- Miệng cười mỉm nhẹ nhàng dễ thương -->
                        <path d="M 46,58 Q 50,61 54,58" stroke="#2f3542" stroke-width="2" fill="none" />
                    </svg>
                </div>
                <p>Hẹn cậu vào một dịp khác phù hợp hơn nha! <br>Chúc cậu có một ngày 20/10 thật nhiều niềm vui, luôn xinh đẹp và ngập tràn hạnh phúc nè! 🌟🎈</p>
            `;
            // Rơi các sticker nhẹ nhàng ấm áp (sao, bong bóng)
            setInterval(() => createEffect(['✨', '🎈', '🌸', '🍀']), 200);
        });

        function createEffect(emojiArray) {
            const effect = document.createElement('div');
            effect.classList.add('funny-effect');
            effect.innerHTML = emojiArray[Math.floor(Math.random() * emojiArray.length)];
            effect.style.left = Math.random() * 100 + 'vw';
            effect.style.animationDuration = Math.random() * 1 + 1.5 + 's';
            document.body.appendChild(effect);
            setTimeout(() => { effect.remove(); }, 2500);
        }
    </script>

</body>
</html>
